<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GuitarTune Ad — Angle A Feed 1080×1080</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw;
    height: 100vw; /* square: 1:1 */
    max-width: 100vw;
    overflow: hidden;
    background: #0A0A0A;
    font-family: 'Arial Black', Arial, sans-serif;
  }
  .root {
    width: 100vw;
    height: 100vw;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .badge {
    position: absolute;
    top: 5.2vw;
    left: 5.2vw;
    background: #4AEDC4;
    color: #0A0A0A;
    font-size: 2vw;
    font-weight: 900;
    letter-spacing: 0.3vw;
    text-transform: uppercase;
    padding: 0.9vw 2vw;
    border-radius: 0.4vw;
  }
  .icon-block {
    width: 16vw;
    height: 16vw;
    background: #111;
    border: 0.28vw solid #4AEDC4;
    border-radius: 3vw;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 5.5vw;
  }
  .icon-block svg {
    width: 8.5vw;
    height: 8.5vw;
  }
  .pain-line {
    font-size: 5.4vw;
    font-weight: 900;
    color: #fff;
    text-align: center;
    line-height: 1.1;
    max-width: 82vw;
    letter-spacing: -0.1vw;
  }
  .pain-line span.highlight { color: #ff4444; }
  .divider {
    width: 7.4vw;
    height: 0.37vw;
    background: #4AEDC4;
    margin: 4.4vw auto;
    border-radius: 0.2vw;
  }
  .solution-line {
    font-size: 3.7vw;
    font-weight: 700;
    color: #4AEDC4;
    text-align: center;
    letter-spacing: 0.1vw;
  }
  .cta {
    position: absolute;
    bottom: 5.2vw;
    right: 5.2vw;
    background: #4AEDC4;
    color: #0A0A0A;
    font-size: 2.4vw;
    font-weight: 900;
    padding: 1.7vw 3.9vw;
    border-radius: 5vw;
    letter-spacing: 0.1vw;
    text-transform: uppercase;
  }
  .noise-strip {
    position: absolute;
    bottom: 5.2vw;
    left: 5.2vw;
    display: flex;
    gap: 0.55vw;
    align-items: flex-end;
  }
  .noise-bar {
    width: 0.74vw;
    background: #ff4444;
    border-radius: 0.2vw;
    opacity: 0.7;
  }
  .xs-label {
    position: absolute;
    bottom: 1.5vw;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 1.7vw;
    color: #2a2a2a;
    letter-spacing: 0.2vw;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="root">
  <div class="badge">GuitarTune</div>

  <div class="icon-block">
    <svg viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="48" cy="48" r="44" stroke="#4AEDC4" stroke-width="3" fill="none"/>
      <line x1="48" y1="8" x2="48" y2="20" stroke="#4AEDC4" stroke-width="4" stroke-linecap="round"/>
      <line x1="48" y1="76" x2="48" y2="88" stroke="#4AEDC4" stroke-width="4" stroke-linecap="round"/>
      <path d="M48 36 L48 52 L58 52" stroke="#4AEDC4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="48" cy="48" r="4" fill="#4AEDC4"/>
      <line x1="16" y1="48" x2="26" y2="48" stroke="#4AEDC4" stroke-width="3" stroke-linecap="round"/>
      <line x1="70" y1="48" x2="80" y2="48" stroke="#4AEDC4" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="pain-line">
    GuitarTuna shows ads<br>
    <span class="highlight">while you're tuning.</span><br>
    We don't.
  </div>

  <div class="divider"></div>

  <div class="solution-line">Free. Always. Ad-free.</div>

  <div class="noise-strip">
    <div class="noise-bar" style="height:1.85vw"></div>
    <div class="noise-bar" style="height:3.3vw"></div>
    <div class="noise-bar" style="height:4.4vw"></div>
    <div class="noise-bar" style="height:2.6vw"></div>
    <div class="noise-bar" style="height:5.2vw"></div>
    <div class="noise-bar" style="height:3vw"></div>
    <div class="noise-bar" style="height:4.1vw"></div>
    <div class="noise-bar" style="height:1.7vw"></div>
  </div>

  <div class="cta">Try Free</div>

  <div class="xs-label">guitartune.app</div>
</div>
</body>
</html>
