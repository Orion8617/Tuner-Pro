<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GuitarTune Ad — Angle C Portrait 1080×1350</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw;
    height: 125vw;
    overflow: hidden;
    background: #0A0A0A;
    font-family: 'Arial Black', Arial, sans-serif;
  }
  .root {
    width: 100vw;
    height: 125vw;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .left-accent { position: absolute; top: 0; left: 0; bottom: 0; width: 0.74vw; background: #4AEDC4; }
  .badge {
    position: absolute; top: 4.8vw; left: 4.8vw;
    background: #4AEDC4; color: #0A0A0A;
    font-size: 2vw; font-weight: 900; letter-spacing: 0.28vw;
    text-transform: uppercase; padding: 0.9vw 2vw; border-radius: 0.37vw;
  }
  .eyebrow {
    font-size: 2vw; font-weight: 700; color: #4AEDC4;
    letter-spacing: 0.46vw; text-transform: uppercase; margin-bottom: 3vw;
  }
  .main-headline {
    font-size: 7vw; font-weight: 900; color: #fff;
    text-align: center; line-height: 1.0; max-width: 84vw;
    letter-spacing: -0.18vw; margin-bottom: 6.7vw;
  }
  .main-headline span { color: #4AEDC4; }
  .spec-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 2.2vw; width: 82vw; margin-bottom: 7.4vw;
  }
  .spec-card {
    background: #111; border: 0.09vw solid #1a1a1a;
    border-radius: 1.5vw; padding: 2.6vw 3vw;
  }
  .spec-card.highlighted { border-color: #4AEDC4; background: #0D1A17; }
  .spec-label {
    font-size: 1.5vw; color: #333; font-weight: 700;
    letter-spacing: 0.18vw; text-transform: uppercase; margin-bottom: 0.93vw;
  }
  .spec-value { font-size: 2.6vw; font-weight: 900; color: #fff; line-height: 1.2; }
  .spec-value.cyan { color: #4AEDC4; }
  .cta-btn {
    background: #4AEDC4; color: #0A0A0A;
    font-size: 2.8vw; font-weight: 900; padding: 2vw 6.7vw;
    border-radius: 5vw; letter-spacing: 0.1vw; text-transform: uppercase;
  }
  .url {
    position: absolute; bottom: 3.7vw; left: 0; right: 0;
    text-align: center; font-size: 2vw; color: #2a2a2a;
    letter-spacing: 0.28vw; text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="root">
  <div class="left-accent"></div>
  <div class="badge">GuitarTune</div>

  <div class="eyebrow">For serious players</div>

  <div class="main-headline">
    The tuner that<br>
    <span>keeps up with you.</span>
  </div>

  <div class="spec-grid">
    <div class="spec-card highlighted">
      <div class="spec-label">Accuracy</div>
      <div class="spec-value cyan">±1 cent<br>precision</div>
    </div>
    <div class="spec-card highlighted">
      <div class="spec-label">Tunings</div>
      <div class="spec-value cyan">10 presets<br>incl. Drop D</div>
    </div>
    <div class="spec-card">
      <div class="spec-label">Ads</div>
      <div class="spec-value" style="color:#4AEDC4">Zero.<br>None. Ever.</div>
    </div>
    <div class="spec-card">
      <div class="spec-label">Pro price</div>
      <div class="spec-value">$9.99/yr<br><span style="font-size:1.7vw;color:#444">vs $47.99 GuitarTuna</span></div>
    </div>
  </div>

  <div class="cta-btn">Download Free</div>

  <div class="url">guitartune.app</div>
</div>
</body>
</html>
