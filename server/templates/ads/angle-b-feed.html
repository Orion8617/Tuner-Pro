<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GuitarTune Ad — Angle B Feed 1080×1080</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw;
    height: 100vw;
    overflow: hidden;
    background: #0A0A0A;
    font-family: 'Arial Black', Arial, sans-serif;
  }
  .root {
    width: 100vw;
    height: 100vw;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .badge {
    position: absolute; top: 5.2vw; left: 5.2vw;
    background: #4AEDC4; color: #0A0A0A;
    font-size: 2vw; font-weight: 900; letter-spacing: 0.28vw;
    text-transform: uppercase; padding: 0.9vw 2vw; border-radius: 0.37vw;
  }
  .timer-display {
    font-size: 13vw; font-weight: 900; color: #4AEDC4;
    letter-spacing: -0.37vw; line-height: 1;
  }
  .timer-unit {
    font-size: 3vw; font-weight: 700; color: #4AEDC4;
    letter-spacing: 0.74vw; text-transform: uppercase;
    margin-bottom: 5.9vw; margin-top: -0.74vw;
  }
  .headline {
    font-size: 4.8vw; font-weight: 900; color: #fff;
    text-align: center; line-height: 1.15; max-width: 78vw;
  }
  .headline span { color: #4AEDC4; }
  .divider { width: 7.4vw; height: 0.37vw; background: #4AEDC4; margin: 4.8vw auto; border-radius: 0.2vw; }
  .subline {
    font-size: 2.8vw; font-weight: 700; color: #555;
    text-align: center; letter-spacing: 0.18vw; text-transform: uppercase;
  }
  .cta {
    position: absolute; bottom: 5.2vw; right: 5.2vw;
    background: #4AEDC4; color: #0A0A0A;
    font-size: 2.4vw; font-weight: 900; padding: 1.7vw 3.9vw;
    border-radius: 5vw; letter-spacing: 0.1vw; text-transform: uppercase;
  }
  .check-row {
    position: absolute; bottom: 6.7vw; left: 5.2vw;
    display: flex; gap: 1.5vw; align-items: center;
  }
  .check-item {
    display: flex; align-items: center; gap: 0.74vw;
    font-size: 1.85vw; color: #444; font-weight: 700; letter-spacing: 0.09vw;
  }
  .check-dot { width: 0.93vw; height: 0.93vw; border-radius: 50%; background: #4AEDC4; }
  .xs-label {
    position: absolute; bottom: 1.5vw; left: 0; right: 0;
    text-align: center; font-size: 1.7vw; color: #1a1a1a;
    letter-spacing: 0.18vw; text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="root">
  <div class="badge">GuitarTune</div>

  <div class="timer-display">&lt;10</div>
  <div class="timer-unit">Seconds to tune</div>

  <div class="headline">
    In tune in under<br>
    <span>10 seconds.</span><br>
    No ads. Ever.
  </div>

  <div class="divider"></div>

  <div class="subline">Drop D · Open G · DADGAD · More</div>

  <div class="check-row">
    <div class="check-item"><div class="check-dot"></div>Free forever</div>
    <div class="check-item"><div class="check-dot"></div>No sign-up</div>
    <div class="check-item"><div class="check-dot"></div>Pro at $0.83/mo</div>
  </div>

  <div class="cta">Tune Now</div>

  <div class="xs-label">guitartune.app</div>
</div>
</body>
</html>
