<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GuitarTune Ad — Angle B Portrait 1080×1350</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw;
    height: 125vw;
    overflow: hidden;
    background: #0A0A0A;
    font-family: 'Arial Black', Arial, sans-serif;
  }
  .root {
    width: 100vw;
    height: 125vw;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .badge {
    position: absolute; top: 4.8vw; left: 4.8vw;
    background: #4AEDC4; color: #0A0A0A;
    font-size: 2vw; font-weight: 900; letter-spacing: 0.28vw;
    text-transform: uppercase; padding: 0.9vw 2vw; border-radius: 0.37vw;
  }
  .headline-block { margin-bottom: 7.4vw; text-align: center; }
  .big-num {
    font-size: 16.7vw; font-weight: 900; color: #4AEDC4;
    line-height: 1; letter-spacing: -0.55vw;
  }
  .big-label {
    font-size: 3.5vw; font-weight: 900; color: #fff;
    letter-spacing: 0.18vw; text-transform: uppercase; margin-top: -1.5vw;
  }
  .step-list { display: flex; flex-direction: column; gap: 0; width: 82vw; margin-bottom: 7.4vw; }
  .step {
    display: flex; align-items: center; gap: 2.6vw;
    padding: 3vw 0; border-bottom: 0.09vw solid #1a1a1a;
  }
  .step-num {
    width: 6.7vw; height: 6.7vw; min-width: 6.7vw;
    border-radius: 50%; border: 0.28vw solid #4AEDC4;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.8vw; font-weight: 900; color: #4AEDC4;
  }
  .step-text { font-size: 2.8vw; font-weight: 700; color: #fff; line-height: 1.2; }
  .step-text span { color: #4AEDC4; }
  .step-sub { font-size: 1.85vw; color: #444; margin-top: 0.37vw; font-weight: 600; letter-spacing: 0.09vw; }
  .no-ads-badge {
    background: #111; border: 0.18vw solid #4AEDC4;
    border-radius: 5vw; padding: 1.5vw 3.7vw;
    font-size: 2.4vw; font-weight: 900; color: #4AEDC4;
    letter-spacing: 0.28vw; text-transform: uppercase; margin-bottom: 6.7vw;
  }
  .cta-btn {
    background: #4AEDC4; color: #0A0A0A;
    font-size: 2.8vw; font-weight: 900; padding: 2vw 6.7vw;
    border-radius: 5vw; letter-spacing: 0.1vw; text-transform: uppercase;
  }
  .url {
    position: absolute; bottom: 3.7vw; left: 0; right: 0;
    text-align: center; font-size: 2vw; color: #2a2a2a;
    letter-spacing: 0.28vw; text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="root">
  <div class="badge">GuitarTune</div>

  <div class="headline-block">
    <div class="big-num">&lt;10</div>
    <div class="big-label">Seconds to tune</div>
  </div>

  <div class="step-list">
    <div class="step">
      <div class="step-num">1</div>
      <div>
        <div class="step-text">Open GuitarTune</div>
        <div class="step-sub">No account. No ads. Opens directly to the tuner.</div>
      </div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div>
        <div class="step-text">Pick your tuning</div>
        <div class="step-sub">Standard · Drop D · Open G · 10+ total</div>
      </div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div>
        <div class="step-text"><span>Pluck. Done.</span></div>
        <div class="step-sub">Real-time pitch detection. Green = in tune.</div>
      </div>
    </div>
  </div>

  <div class="no-ads-badge">No Ads. Ever.</div>

  <div class="cta-btn">Download Free</div>

  <div class="url">guitartune.app</div>
</div>
</body>
</html>
