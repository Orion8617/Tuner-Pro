<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LocalizaHN · Número Protegido</title>
<link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
:root {
  --bg:#060a12;--surface:#0c1422;--hn-blue:#0077C8;--hn-blue-light:#00A3FF;
  --gold:#FFB800;--gold-dark:#D49B00;--red:#FF4757;
  --glass:rgba(12,20,34,0.95);--border:rgba(0,163,255,0.12);
  --text:#7A8BA0;--white:#F0F4F8;--muted:#3D4D5C;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;overflow:hidden}

.shield-page{
  width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}

.scanlines{
  position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,163,255,.03) 2px,rgba(0,163,255,.03) 4px);
  animation:scanMove 8s linear infinite;
}
@keyframes scanMove{0%{background-position:0 0}100%{background-position:0 200px}}

.static-noise{
  position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:.08;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  animation:noiseFlicker .15s steps(5) infinite;
}
@keyframes noiseFlicker{0%{opacity:.06}25%{opacity:.1}50%{opacity:.04}75%{opacity:.09}100%{opacity:.07}}

.shield-glow-bg{
  position:absolute;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,184,0,.12) 0%,transparent 70%);
  animation:glowPulse 3s ease-in-out infinite;z-index:0;
}
@keyframes glowPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.3);opacity:1}}

.pulse-ring{
  position:absolute;width:200px;height:200px;border-radius:50%;
  border:2px solid rgba(255,184,0,.3);z-index:1;
  animation:ringExpand 3s ease-out infinite;
}
.pulse-ring:nth-child(2){animation-delay:.8s;border-color:rgba(255,184,0,.2)}
.pulse-ring:nth-child(3){animation-delay:1.6s;border-color:rgba(255,184,0,.15)}
@keyframes ringExpand{0%{transform:scale(.5);opacity:1}100%{transform:scale(3);opacity:0}}

.shield-container{position:relative;z-index:10;text-align:center}

.shield-svg{width:160px;height:190px;filter:drop-shadow(0 0 30px rgba(255,184,0,.4));margin-bottom:16px}

.shield-number{
  font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;
  color:var(--white);letter-spacing:2px;margin-bottom:6px;
  text-shadow:0 0 20px rgba(0,163,255,.5);
}

.shield-title{
  font-size:28px;font-weight:900;letter-spacing:3px;margin-bottom:10px;
  background:linear-gradient(135deg,var(--gold),#FFD040,var(--gold-dark));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:titleGlow 2s ease-in-out infinite;
}
@keyframes titleGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}

.shield-subtitle{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);
  letter-spacing:1px;max-width:380px;line-height:1.8;margin:0 auto 24px;
}

.shield-status{
  display:inline-flex;align-items:center;gap:8px;padding:8px 20px;
  background:rgba(255,184,0,.06);border:1px solid rgba(255,184,0,.2);border-radius:20px;
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--gold);
  letter-spacing:2px;margin-bottom:28px;
}
.shield-status-dot{
  width:8px;height:8px;border-radius:50%;background:var(--gold);
  animation:dotPulse 1.5s ease-in-out infinite;
}
@keyframes dotPulse{0%,100%{opacity:1;box-shadow:0 0 4px var(--gold)}50%{opacity:.4;box-shadow:0 0 12px var(--gold)}}

.shield-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-shield{
  padding:12px 24px;border-radius:10px;font-family:'Inter',sans-serif;font-size:13px;
  font-weight:700;letter-spacing:.5px;text-decoration:none;transition:all .25s;display:inline-flex;align-items:center;gap:8px;
}
.btn-shield.gold{
  background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#0a0e14;
  border:none;box-shadow:0 4px 20px rgba(255,184,0,.3);cursor:pointer;
}
.btn-shield.gold:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(255,184,0,.5)}
.btn-shield.outline{
  background:transparent;border:1px solid var(--border);color:var(--hn-blue-light);cursor:pointer;
}
.btn-shield.outline:hover{background:rgba(0,163,255,.06);border-color:var(--hn-blue-light)}

.circuit-h-glow{animation:circuitPulse 2s ease-in-out infinite}
@keyframes circuitPulse{0%,100%{opacity:.7}50%{opacity:1}}
.circuit-node{animation:nodeBlink 1.5s ease-in-out infinite}
.circuit-node:nth-child(even){animation-delay:.5s}
.circuit-node:nth-child(3n){animation-delay:1s}
@keyframes nodeBlink{0%,100%{opacity:.5;r:2.5}50%{opacity:1;r:3.5}}

.blocked-label{
  position:absolute;bottom:20px;left:0;right:0;text-align:center;
  font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);
  letter-spacing:2px;z-index:10;
}
</style>
</head>
<body>
<div class="shield-page">
  <div class="scanlines"></div>
  <div class="static-noise"></div>
  <div class="shield-glow-bg"></div>
  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>

  <div class="shield-container">
    <svg class="shield-svg" viewBox="0 0 120 145" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFB800" stop-opacity=".15"/>
          <stop offset="50%" stop-color="#0077C8" stop-opacity=".08"/>
          <stop offset="100%" stop-color="#FFB800" stop-opacity=".12"/>
        </linearGradient>
        <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFB800"/>
          <stop offset="50%" stop-color="#FFD040"/>
          <stop offset="100%" stop-color="#D49B00"/>
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="2" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <path d="M60 5 L110 25 L110 70 Q110 115 60 140 Q10 115 10 70 L10 25 Z"
            fill="url(#shieldGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

      <g filter="url(#glow)" class="circuit-h-glow">
        <line x1="40" y1="45" x2="40" y2="100" stroke="#0077C8" stroke-width="3" stroke-linecap="round"/>
        <line x1="80" y1="45" x2="80" y2="100" stroke="#0077C8" stroke-width="3" stroke-linecap="round"/>
        <line x1="40" y1="72" x2="80" y2="72" stroke="#0077C8" stroke-width="3" stroke-linecap="round"/>

        <line x1="40" y1="45" x2="30" y2="38" stroke="#0077C8" stroke-width="1.5" stroke-linecap="round" opacity=".6"/>
        <line x1="30" y1="38" x2="22" y2="38" stroke="#0077C8" stroke-width="1" stroke-linecap="round" opacity=".4"/>
        <line x1="40" y1="60" x2="28" y2="55" stroke="#0077C8" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
        <line x1="28" y1="55" x2="20" y2="60" stroke="#0077C8" stroke-width="1" stroke-linecap="round" opacity=".3"/>
        <line x1="40" y1="85" x2="30" y2="90" stroke="#0077C8" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
        <line x1="30" y1="90" x2="25" y2="85" stroke="#0077C8" stroke-width="1" stroke-linecap="round" opacity=".3"/>
        <line x1="40" y1="100" x2="32" y2="108" stroke="#0077C8" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>

        <line x1="80" y1="45" x2="90" y2="38" stroke="#0077C8" stroke-width="1.5" stroke-linecap="round" opacity=".6"/>
        <line x1="90" y1="38" x2="98" y2="38" stroke="#0077C8" stroke-width="1" stroke-linecap="round" opacity=".4"/>
        <line x1="80" y1="60" x2="92" y2="55" stroke="#0077C8" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
        <line x1="92" y1="55" x2="100" y2="60" stroke="#0077C8" stroke-width="1" stroke-linecap="round" opacity=".3"/>
        <line x1="80" y1="85" x2="90" y2="90" stroke="#0077C8" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
        <line x1="90" y1="90" x2="95" y2="85" stroke="#0077C8" stroke-width="1" stroke-linecap="round" opacity=".3"/>
        <line x1="80" y1="100" x2="88" y2="108" stroke="#0077C8" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>

        <line x1="52" y1="72" x2="52" y2="62" stroke="#0077C8" stroke-width="1" stroke-linecap="round" opacity=".4"/>
        <line x1="68" y1="72" x2="68" y2="82" stroke="#0077C8" stroke-width="1" stroke-linecap="round" opacity=".4"/>
        <line x1="60" y1="72" x2="60" y2="55" stroke="#0077C8" stroke-width="1" stroke-linecap="round" opacity=".35"/>
        <line x1="60" y1="72" x2="60" y2="90" stroke="#0077C8" stroke-width="1" stroke-linecap="round" opacity=".35"/>
      </g>

      <g>
        <circle class="circuit-node" cx="40" cy="45" r="3" fill="#FFB800"/>
        <circle class="circuit-node" cx="40" cy="72" r="3" fill="#FFB800"/>
        <circle class="circuit-node" cx="40" cy="100" r="3" fill="#FFB800"/>
        <circle class="circuit-node" cx="80" cy="45" r="3" fill="#FFB800"/>
        <circle class="circuit-node" cx="80" cy="72" r="3" fill="#FFB800"/>
        <circle class="circuit-node" cx="80" cy="100" r="3" fill="#FFB800"/>
        <circle class="circuit-node" cx="30" cy="38" r="2" fill="#FFB800" opacity=".7"/>
        <circle class="circuit-node" cx="90" cy="38" r="2" fill="#FFB800" opacity=".7"/>
        <circle class="circuit-node" cx="28" cy="55" r="2" fill="#FFB800" opacity=".6"/>
        <circle class="circuit-node" cx="92" cy="55" r="2" fill="#FFB800" opacity=".6"/>
        <circle class="circuit-node" cx="30" cy="90" r="2" fill="#FFB800" opacity=".6"/>
        <circle class="circuit-node" cx="90" cy="90" r="2" fill="#FFB800" opacity=".6"/>
        <circle class="circuit-node" cx="52" cy="62" r="1.5" fill="#FFB800" opacity=".5"/>
        <circle class="circuit-node" cx="68" cy="82" r="1.5" fill="#FFB800" opacity=".5"/>
        <circle class="circuit-node" cx="60" cy="55" r="1.5" fill="#FFB800" opacity=".5"/>
        <circle class="circuit-node" cx="60" cy="90" r="1.5" fill="#FFB800" opacity=".5"/>
      </g>
    </svg>

    <div class="shield-number">{{ phone_number }}</div>
    <div class="shield-title">NÚMERO PROTEGIDO</div>
    <div class="shield-status"><div class="shield-status-dot"></div>ESCUDO ANTI-LOCALIZACIÓN ACTIVO</div>
    <div class="shield-subtitle">
      Este número está bajo protección del<br>
      <strong style="color:var(--gold)">Escudo Anti-Localización</strong> de LocalizaHN.<br>
      No es posible rastrear ni localizar este dispositivo.
    </div>
    <div class="shield-actions">
      <a href="{{ url_for('planes') }}" class="btn-shield gold"><i class="fas fa-shield-alt"></i> Protege Tu Número</a>
      <a href="{{ url_for('index') }}" class="btn-shield outline"><i class="fas fa-arrow-left"></i> Volver</a>
    </div>
  </div>

  <div class="blocked-label">★ LOCALIZAHN · ESCUDO ANTI-LOCALIZACIÓN · POWERED BY AI ★</div>
</div>
</body>
</html>
